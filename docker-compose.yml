version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cardio_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medical_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cardio_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/medical_ai
      - SECRET_KEY=DOCKER_SECURE_KEY_HEART_AI_PLATFORM_2026
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_reports:/app/reports
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cardio_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
  backend_reports:
